{% extends "base.html" %}
{% block title %}Change Password — {{ site_name }}{% endblock %}
{% block body_class %}page-admin{% endblock %}

{% block content %}
<section class="wrap admin-bar">
  <div>
    <h1>Change password</h1>
  </div>
  <div class="admin-bar__actions">
    <a href="{{ url_for('admin_dashboard') }}" class="btn btn--ghost">Back to dashboard</a>
  </div>
</section>

<section class="wrap auth-wrap">
  <form class="auth-card" method="POST" action="{{ url_for('admin_change_password') }}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

    <label class="field">
      <span>Current password</span>
      <input type="password" name="current_password" autocomplete="current-password" required>
    </label>

    <label class="field">
      <span>New password <em>(at least 8 characters)</em></span>
      <input type="password" name="new_password" autocomplete="new-password" required minlength="8">
    </label>

    <label class="field">
      <span>Confirm new password</span>
      <input type="password" name="confirm_password" autocomplete="new-password" required minlength="8">
    </label>

    <button type="submit" class="btn btn--primary btn--block">Update password</button>
  </form>
</section>
{% endblock %}
